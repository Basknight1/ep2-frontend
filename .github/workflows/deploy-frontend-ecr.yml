name: Deploy Frontend to ECR and EC2

on:
  push:
    branches: [ "deploy" ]

  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_FRONT_INSTANCE_ID: ${{ vars.EC2_FRONT_INSTANCE_ID }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_SECRET_KEY: ${{ secrets.FRONTEND_SECRET_KEY }}
      IMAGE_URI: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validar identidad AWS
        run: aws sts get-caller-identity

      - name: Iniciar sesión en Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Construir imagen Docker del frontend
        run: docker build -t "$IMAGE_URI" .

      - name: Subir imagen frontend a ECR
        run: docker push "$IMAGE_URI"

      - name: Desplegar frontend en EC2 usando SSM
        run: |
          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY",
              "sudo docker pull $IMAGE_URI",
              "sudo docker rm -f ep2-frontend || true",
              "sudo docker run -d --name ep2-frontend --restart unless-stopped -p 5000:5000 -e PORT=5000 -e DEBUG=False -e BACKEND_URL=$BACKEND_URL -e SECRET_KEY=$FRONTEND_SECRET_KEY $IMAGE_URI",
              "sudo docker ps"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$EC2_FRONT_INSTANCE_ID" \
            --comment "Deploy frontend container from GitHub Actions" \
            --parameters file://ssm-commands.json \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_FRONT_INSTANCE_ID" \
            --region "$AWS_REGION"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_FRONT_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text
